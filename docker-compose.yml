services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: restaurant_loyalty_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_loyalty
      POSTGRES_USER: loyalty_user
      POSTGRES_PASSWORD: loyalty_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: restaurant_loyalty_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: otidumeando@gmail.com
      PGADMIN_DEFAULT_PASSWORD: loyalty_secret
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
