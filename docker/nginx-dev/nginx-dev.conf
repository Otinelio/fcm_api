# Proxy de dev, lancé par `composer dev` (voir composer.json) sur le port
# 8000 — celui-là seul est exposé (LAN direct ou tunnel ngrok, qui ne
# tunnelle qu'un seul port sur le plan gratuit). Sans lui, le port Reverb
# (8080) n'est jamais joignable depuis l'app côté tunnel ngrok : les cartes
# ne se mettent plus à jour en direct, seulement au rechargement manuel.
#
# Route par chemin sur ce même port 8000 :
#   /app/*  -> Reverb (WebSocket, protocole Pusher)      127.0.0.1:8080
#   tout le reste -> Laravel (`php artisan serve`)        127.0.0.1:8001
#
# Instance nginx dédiée (pas le nginx système) : pid/logs/tmp restent dans ce
# dossier, aucun droit root requis, aucune interférence avec une config
# nginx système existante sur la machine.

worker_processes 1;
pid docker/nginx-dev/nginx-dev.pid;
error_log docker/nginx-dev/logs/error.log warn;

events {
    worker_connections 64;
}

http {
    access_log docker/nginx-dev/logs/access.log;
    client_body_temp_path docker/nginx-dev/tmp/client_body;
    proxy_temp_path docker/nginx-dev/tmp/proxy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8000;

        location /app/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
